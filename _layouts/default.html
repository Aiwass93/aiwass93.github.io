<!doctype html>
<html lang="{{ page.lang | default: 'en' | escape }}">
<meta charset=utf-8>
<meta name=viewport content="width=device-width">
<title>{{ page.title | escape }}</title>
<link rel=icon href="/assets/images/icon.png">
<link rel=alternate type="application/atom+xml" href="/feed.xml">
<style>
img{max-width:50%;max-height:75vh;width:auto;height:auto}
summary{display:block;width:fit-content;color:LinkText;text-decoration:underline;cursor:pointer}
summary::-webkit-details-marker{display:none}
#quick-intro{display:flex;flex-wrap:wrap;column-gap:.25em}
#quick-intro>details{display:contents}
#quick-intro>details::details-content{order:1;flex-basis:100%;min-width:0}
#quick-intro>details:not([open])::details-content{display:none}
#buttons img{max-width:100%;max-height:none;image-rendering:pixelated;vertical-align:top}
</style>
{{ content }}
{% unless page.url == "/" %}<p><a href="/">back</a></p>{% endunless %}
