<style>
:root{--font:Helvetica, Arial, sans-serif;--size:100%;--weight:500;--stroke:0.05px;--emph:0.05px;--narrow:0.96;--bg:#fcfcfc;--fg:#211f1e;--fg-cjk:#333130;--link:#0038a8;--visited:#0038a8;--hover:#0038a8;--look:url(#look)}
html{background:var(--bg);font-family:var(--font);font-size:var(--size);font-weight:var(--weight);color-scheme:light}
:where([lang]){color:var(--fg)}
:where([lang]:lang(zh),[lang]:lang(ja),[lang]:lang(ko)){color:var(--fg-cjk)}
:is(h1,h2,h3,h4,h5,h6,b,strong,th){font-weight:inherit}
:is(a,summary){color:var(--link)}a:visited{color:var(--visited)}:is(a,summary):hover{color:var(--hover)}
#button-wall{display:flex;flex-wrap:wrap;gap:4px}#button-wall img{display:block}
blockquote{--end:40px}
@media screen and (forced-colors:none){
html{-webkit-text-stroke-width:var(--stroke)}
:is(h1,h2,h3,h4,h5,h6,b,strong,th){-webkit-text-stroke-width:calc(var(--stroke) + var(--emph))}
body :not(details,svg,img,audio,video,:has(img,audio,video)):not(body :not(details,:has(img,audio,video)) *){filter:var(--look)}
body :is(p,h1,h2,h3,h4,h5,h6,ul,ol,dl,dt,dd,li,blockquote,pre,div,section,article,figcaption,table,hr,address):not(:has(img,audio,video)):not(body :not(details,:has(img,audio,video)) *){transform:scaleX(var(--narrow));transform-origin:0 0;margin-right:calc(var(--end,0px) + (var(--narrow) - 1) / var(--narrow) * 100%)}
}
</style>
